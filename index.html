<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT.TEAM — Задачи группы</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <div class="phone-container">
        <header>
            <div class="team-title">it. team</div>
            <div class="main-nav">
                <h1>Задачи группы</h1>
                <button class="add-task-toggle" id="openModalBtn">+</button>
            </div>
        </header>

        <div class="stats-badges">
            <div class="stat-box current-box">
                <span class="stat-num" id="currentCount">0</span> Текущие
            </div>
            <div class="stat-box completed-box">
                <span class="stat-num" id="completedCount">0</span> Выполненные
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-filter="all">Все</button>
            <button class="tab-btn" data-filter="current">Текущие</button>
            <button class="tab-btn" data-filter="completed">Выполненные</button>
        </div>

        <ul class="task-list" id="taskList"></ul>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="location.href='/'">
                <span class="nav-icon">📋</span> Задачи
            </button>
            <button class="nav-item" onclick="location.href='/calendar'">
                <span class="nav-icon">📅</span> Календарь
            </button>
            <button class="nav-item" onclick="location.href='/group'">
                <span class="nav-icon">👥</span> Группа
            </button>
        </nav>

        <div class="modal-overlay" id="modalOverlay">
            <form class="modal-content" id="taskForm">
                <h3>Новая задача</h3>
                <input type="text" id="taskTitle" placeholder="Название (например, Лабораторная № 3)" required>
                <input type="text" id="taskSubject" placeholder="Предмет (например, Программирование)" required>
                <select id="taskPriority">
                    <option value="medium">Средний приоритет</option>
                    <option value="high">Высокий приоритет</option>
                    <option value="low">Низкий приоритет</option>
                </select>
                <input type="datetime-local" id="taskDeadline" required>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" id="closeModalBtn">Отмена</button>
                    <button type="submit" class="btn btn-primary">Создать задачу</button>
                </div>
            </form>
        </div>
    </div>

    <script src="static/app.js"></script>
</body>
</html>
